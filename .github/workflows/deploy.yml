name: Build and Deploy dev/hsu_blog

on:
    push:
        branches:
            - "dev/hsu_blog" # 只在 dev/hsu_blog 分支 push 时触发

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # 安装 Node (必须放在 pnpm action 之前)
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # 安装 pnpm（非常重要，否则 pnpm 不会存在于 PATH）
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            # 安装依赖
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # 构建
            # 字体 CDN（尤其 zeoseven）偶尔超时；已下载的字体缓存在 node_modules/.astro，重试只补缺的
            - name: Build project
              run: |
                  for i in 1 2 3; do
                    pnpm build && exit 0
                    echo "::warning::build attempt $i failed, retrying"
                    sleep 5
                  done
                  exit 1

            # SSH 准备
            - name: Setup SSH
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.DEPLOY_KEY }}

            # SSH 在 22222 端口；国际线路偶尔丢连接，所以带重试
            - name: Add known hosts
              run: |
                  mkdir -p ~/.ssh
                  for i in 1 2 3 4 5; do
                    ssh-keyscan -p 22222 -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts && [ -s ~/.ssh/known_hosts ] && break
                    sleep 5
                  done
                  [ -s ~/.ssh/known_hosts ]

            # 通过 rsync 部署
            - name: Deploy via rsync
              run: |
                  for i in 1 2 3; do
                    rsync -avz --delete \
                      -e "ssh -p 22222 -o ConnectTimeout=20" \
                      --exclude='**/.user.ini' \
                      ./dist/ \
                      ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/ && exit 0
                    sleep 10
                  done
                  exit 1
